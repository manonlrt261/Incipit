name: incipit-local

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: incipit-docker-local-development-only
      DATABASE_URL: "mysql://incipit:incipit_local@database:3306/incipit_demo?serverVersion=8.4.0&charset=utf8mb4"
      DEFAULT_URI: http://localhost:8080
      MAILER_DSN: smtp://mailer:1025
      MAILER_FROM: incipit@example.invalid
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: incipit_demo_logs
      GOOGLE_BOOKS_API_KEY: ""
      SERPAPI_API_KEY: ""
    volumes:
      - app_var:/var/www/html/var
      - couvertures:/var/www/html/public/uploads
    depends_on:
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailer:
        condition: service_started

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: incipit_demo
      MYSQL_USER: incipit
      MYSQL_PASSWORD: incipit_local
      MYSQL_ROOT_PASSWORD: incipit_root_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailer:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data:
  mongo_data:
  couvertures:
  app_var:
